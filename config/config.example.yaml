# Twitter 自动发推系统配置文件示例
# 复制此文件为 config.yaml 并填入真实的 API 凭据

# Twitter API 配置
twitter:
  # ===== OAuth 2.0 配置（推荐使用）=====
  # Twitter OAuth 2.0 Access Token
  # 通过 OAuth 2.0 授权流程获取
  access_token: "your_oauth2_access_token_here"

  # Twitter OAuth 2.0 Refresh Token
  # 用于自动刷新 access_token
  refresh_token: "your_oauth2_refresh_token_here"

  # Token 过期时间（ISO 格式，自动生成）
  token_expires_at: ""

  # Twitter OAuth 2.0 Client ID
  # 获取方式：https://developer.twitter.com/en/portal/dashboard
  client_id: "your_client_id_here"

  # Twitter OAuth 2.0 Client Secret（可选，用于机密客户端）
  client_secret: "your_client_secret_here"

  # ===== OAuth 1.0a 配置（旧版，兼容性保留）=====
  # Twitter API v2 Bearer Token
  bearer_token: "your_bearer_token_here"

  # Twitter API v2 Access Token Secret (OAuth 1.0a)
  access_token_secret: "your_access_token_secret_here"

  # Twitter API v2 Consumer Key (API Key)
  consumer_key: "your_consumer_key_here"

  # Twitter API v2 Consumer Secret (API Secret)
  consumer_secret: "your_consumer_secret_here"

# LLM API 配置（支持 OpenAI 和 Grok）
openai:
  # 选择 LLM 提供商: "openai" 或 "grok"
  provider: "grok"

  # OpenAI API Key（如果使用 OpenAI）
  # 获取方式：https://platform.openai.com/api-keys
  api_key: "sk-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"

  # Grok API Key（如果使用 Grok）
  # 获取方式：https://console.x.ai/
  grok_api_key: "xai-XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"

  # 使用的模型
  # OpenAI: "gpt-4", "gpt-3.5-turbo", "gpt-4-turbo"
  # Grok: "grok-3", "grok-2-latest", "grok-vision-beta"
  model: "grok-3"

  # Grok API Base URL（通常不需要修改）
  grok_base_url: "https://api.x.ai/v1"
  
  # 生成推文的提示词
  prompt_template: |
    请生成一条有趣且有价值的推文，内容应该：
    1. 长度在100-280字符之间
    2. 包含实用信息或有趣观点
    3. 适合在Twitter上分享
    4. 语言风格轻松友好
    
    主题可以是：技术、生活感悟、学习心得、行业观察等。
    请直接返回推文内容，不要包含其他说明文字。

# 数据源配置
data_sources:
  # Coinglass 爆仓数据（可选）
  coinglass:
    api_key: "your_coinglass_api_key_here"
    enabled: false  # 设置为 true 启用

  # L2 TVL 数据（可选）
  l2:
    provider: "defillama"  # 可选: "defillama" 或 "l2beat"
    enabled: true

  # 宏观数据（可选）
  macro:
    provider: "yfinance"  # 使用 yfinance 库
    enabled: true

  # 加密货币新闻（可选）
  news:
    provider: "cryptopanic"  # 推荐使用 "cryptopanic" (需要免费 API Key)
    enabled: true
    # CryptoPanic API Key（免费注册获取）
    cryptopanic_api_key: "your_cryptopanic_api_key_here"

  # OKLink API（可选，用于获取 X Layer 链上活跃度数据）
  oklink:
    api_key: "your_oklink_api_key_here"  # 可选，免费版每天 10,000 次请求
    # 获取方法: https://www.oklink.com/account/my-api

# 代理配置
proxy:
  # SOCKS5 代理地址，格式：socks5://user:pass@ip:port
  # 如果不需要认证，格式：socks5://ip:port
  # 示例：socks5://username:password@127.0.0.1:1080
  socks5_url: "socks5://127.0.0.1:1080"
  
  # 是否启用代理（如果不需要代理，设置为 false）
  enabled: false

# 定时任务配置
scheduler:
  # 每天发推次数
  tweets_per_day: 1

  # 发推时间点（24小时制，基于设置的时区）
  tweet_times:
    - "08:00"  # 早上8点（美国时间）

  # 时区设置
  # 美国时区选项:
  #   - America/New_York (东部时间 EST/EDT)
  #   - America/Los_Angeles (太平洋时间 PST/PDT)
  #   - America/Chicago (中部时间 CST/CDT)
  #   - America/Denver (山地时间 MST/MDT)
  # 其他时区:
  #   - Asia/Shanghai (中国)
  #   - Europe/London (英国)
  #   - UTC (协调世界时)
  timezone: "America/New_York"

  # 固定推文内容（如果设置，则每次发送固定内容；如果为空或null，则使用LLM生成）
  # 留空或设置为 null 将使用 LLM 自动生成内容
  fixed_content: "Good morning! 🌅 Have a great day! #DailyGreeting"
  # fixed_content: null  # 使用 LLM 生成内容

  # 每日大盘复盘配置
  daily_recap:
    # 是否启用每日大盘复盘
    enabled: true

    # 复盘时间（24小时制，基于设置的时区）
    recap_time: "20:00"  # 晚上8点

# Flask 应用配置
flask:
  # 服务器主机（0.0.0.0 表示接受所有IP访问）
  host: "0.0.0.0"
  
  # 服务器端口
  port: 5000
  
  # 调试模式（生产环境建议设置为 false）
  debug: false

# 日志配置
logging:
  # 日志级别：DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: "INFO"
  
  # 日志文件路径
  file_path: "logs/twitter_bot.log"
  
  # 日志格式
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # 是否同时输出到控制台
  console_output: true
