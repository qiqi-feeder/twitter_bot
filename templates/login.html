<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Twitter Bot</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #1d9bf0;
      --bg-color: #000000;
      --surface-color: #16181c;
      --text-color: #e7e9ea;
      --border-color: #2f3336;
      --input-bg: #202327;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-container {
      background-color: var(--surface-color);
      padding: 40px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      text-align: center;
      border: 1px solid var(--border-color);
    }

    .logo {
      font-size: 48px;
      color: var(--text-color);
      margin-bottom: 20px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 30px;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #71767b;
    }

    input[type="password"] {
      width: 100%;
      padding: 12px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-color);
      font-size: 16px;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }

    input[type="password"]:focus {
      outline: none;
      border-color: var(--primary-color);
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--text-color);
      color: var(--bg-color);
      border: none;
      border-radius: 24px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #d7dbdc;
    }

    .error-message {
      color: #f4212e;
      margin-top: 15px;
      font-size: 14px;
      display: none;
    }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="logo"><i class="fab fa-twitter"></i></div>
    <h1>Sign in to Bot</h1>
    <form id="loginForm">
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autofocus>
      </div>
      <button type="submit">Next</button>
      <div class="error-message" id="errorMessage">Incorrect password</div>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('errorMessage');
      const btn = e.target.querySelector('button');

      btn.disabled = true;
      btn.textContent = 'Verifying...';
      errorMessage.style.display = 'none';

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ password })
        });

        const result = await response.json();

        if (result.success) {
          window.location.href = '/compose';
        } else {
          errorMessage.style.display = 'block';
          errorMessage.textContent = result.message || 'Incorrect password';
          btn.disabled = false;
          btn.textContent = 'Next';
        }
      } catch (error) {
        errorMessage.style.display = 'block';
        errorMessage.textContent = 'Network error';
        btn.disabled = false;
        btn.textContent = 'Next';
      }
    });
  </script>
</body>

</html>
